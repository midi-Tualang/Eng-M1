<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT English – Minggu Pertama</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --border: #1e2d45;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --card: #161f2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- starfield bg ---- */
  body::before {
    content:'';
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, #0d1f3c88 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 80% 70%, #1a0a3088 0%, transparent 70%);
    pointer-events:none;
  }

  .stars {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff6 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, #fff4 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 10%, #fff5 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, #fff3 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 40%, #fff4 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, #fff3 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 50%, #fff2 0%, transparent 100%);
  }

  /* ---- header ---- */
  header {
    position:relative; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.9);
    backdrop-filter: blur(10px);
  }
  .logo {
    font-family:'Space Mono',monospace;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .logo span { color: var(--accent2); }
  .week-badge {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 99px;
    letter-spacing: 1px;
  }
  .xp-bar-wrap {
    display:flex; align-items:center; gap:10px;
  }
  .xp-label { font-size:0.75rem; color:var(--warn); font-family:'Space Mono',monospace; }
  .xp-bar {
    width:120px; height:8px; background:#1e2d45; border-radius:4px; overflow:hidden;
  }
  .xp-fill {
    height:100%; background: linear-gradient(90deg, var(--warn), #f97316);
    border-radius:4px; transition:width 0.6s ease;
  }

  /* ---- main layout ---- */
  .app {
    position:relative; z-index:5;
    max-width: 940px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ---- screen titles ---- */
  .screen { display:none; animation: fadeIn .35s ease; }
  .screen.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  /* ====== HOME SCREEN ====== */
  .home-title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .home-title .hl { color: var(--accent); }
  .home-sub {
    color: var(--muted); font-size: 1rem; margin-bottom: 36px; max-width: 500px;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .day-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 10px;
    text-align: center;
    cursor: pointer;
    transition: all .25s ease;
    position: relative;
    overflow: hidden;
  }
  .day-btn:hover { border-color: var(--accent); transform:translateY(-3px); box-shadow:0 8px 24px #00e5ff22; }
  .day-btn.locked { opacity:.4; cursor:not-allowed; }
  .day-btn.done { border-color: var(--accent3); }
  .day-btn .day-num { font-family:'Space Mono',monospace; font-size:1.5rem; font-weight:700; color:var(--accent); }
  .day-btn.done .day-num { color: var(--accent3); }
  .day-btn .day-label { font-size:0.72rem; color:var(--muted); margin-top:4px; }
  .day-btn .tick { position:absolute; top:8px; right:10px; font-size:1rem; }
  .day-btn .day-topic { font-size:0.68rem; color:var(--text); margin-top:6px; opacity:.8; }

  /* Butang Pergi Minggu 2 */
  #btnMinggu2:hover { filter: brightness(1.1); transform: translateY(-2px); }

  /* ====== LESSON SCREEN ====== */
  .lesson-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px;
  }
  .back-btn {
    background:none; border:1px solid var(--border); color:var(--muted);
    padding:8px 18px; border-radius:8px; cursor:pointer; font-family:'Syne',sans-serif;
    font-size:0.85rem; transition: all .2s;
  }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .progress-wrap { display:flex; gap:6px; }
  .prog-dot {
    width:28px; height:6px; border-radius:3px;
    background: var(--border); transition:background .3s;
  }
  .prog-dot.done { background: var(--accent3); }
  .prog-dot.active { background: var(--accent); }

  /* vocab card */
  .vocab-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    text-align: center;
    margin-bottom: 20px;
    position:relative;
    overflow:hidden;
  }
  .vocab-card::before {
    content:''; position:absolute; top:-40px; right:-40px;
    width:160px; height:160px;
    background: radial-gradient(circle, var(--accent2)22 0%, transparent 70%);
    border-radius:50%;
  }
  .vocab-card .category-tag {
    display:inline-block;
    background: var(--accent2)33;
    color: var(--accent2);
    border:1px solid var(--accent2)55;
    font-size:0.7rem; font-family:'Space Mono',monospace;
    padding:3px 12px; border-radius:99px; margin-bottom:16px;
    letter-spacing:1px; text-transform:uppercase;
  }
  .vocab-card .word {
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 6px;
    line-height:1.1;
  }
  .vocab-card .phonetic {
    font-family:'Space Mono',monospace;
    color: var(--muted); font-size:0.9rem; margin-bottom:14px;
  }
  .vocab-card .meaning-ms {
    font-size: 1.1rem; color: var(--text); font-weight:700; margin-bottom:8px;
  }
  .vocab-card .example {
    font-size:0.9rem; color:var(--muted); font-style:italic;
    border-left:3px solid var(--accent2); padding-left:14px; text-align:left;
    margin-top:12px;
  }
  .vocab-card .example-ms {
    font-size:0.82rem; color:var(--muted)aa; padding-left:14px; text-align:left; margin-top:4px;
  }

  .speak-btn {
    display:inline-flex; align-items:center; gap:8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color:#fff; border:none; padding:12px 28px; border-radius:12px;
    font-family:'Syne',sans-serif; font-size:1rem; font-weight:700;
    cursor:pointer; margin-top:18px; transition:all .2s;
  }
  .speak-btn:hover { transform:scale(1.04); box-shadow:0 6px 20px var(--accent2)55; }
  .speak-btn:active { transform:scale(.98); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from{box-shadow:0 0 0 0 var(--accent)44} to{box-shadow:0 0 0 12px transparent} }

  .nav-btns {
    display:flex; gap:12px; justify-content:center; margin-top:20px;
  }
  .nav-btn {
    padding:12px 32px; border-radius:12px; font-family:'Syne',sans-serif;
    font-weight:700; font-size:0.95rem; cursor:pointer; border:none; transition:all .2s;
  }
  .nav-btn.prev { background:var(--card); border:1px solid var(--border); color:var(--muted); }
  .nav-btn.prev:hover { border-color:var(--accent); color:var(--accent); }
  .nav-btn.next { background: var(--accent); color: #000; }
  .nav-btn.next:hover { background: #33eeff; }

  /* ====== QUIZ SCREEN ====== */
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 20px;
  }
  .quiz-q {
    font-size:0.85rem; color:var(--muted); font-family:'Space Mono',monospace;
    margin-bottom:10px; text-transform:uppercase; letter-spacing:1px;
  }
  .quiz-word {
    font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight:800; color:var(--accent);
    margin-bottom: 8px;
  }
  .quiz-phonetic { font-family:'Space Mono',monospace; color:var(--muted); font-size:0.85rem; margin-bottom:20px; }
  .quiz-speak-btn {
    background: var(--card); border:1px solid var(--accent2);
    color:var(--accent2); padding:8px 20px; border-radius:8px;
    font-family:'Syne',sans-serif; cursor:pointer; font-size:0.85rem; margin-bottom:24px;
    transition:all .2s;
  }
  .quiz-speak-btn:hover { background:var(--accent2)22; }

  .options-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .option-btn {
    padding:14px 16px; border-radius:12px;
    background: var(--panel); border:1px solid var(--border);
    color:var(--text); font-family:'Syne',sans-serif; font-size:0.9rem;
    cursor:pointer; text-align:left; transition:all .2s; line-height:1.4;
  }
  .option-btn:hover:not(:disabled) { border-color:var(--accent); background:var(--accent)11; }
  .option-btn.correct { background:var(--accent3)22; border-color:var(--accent3); color:var(--accent3); }
  .option-btn.wrong { background:var(--danger)22; border-color:var(--danger); color:var(--danger); }
  .option-btn:disabled { cursor:not-allowed; }
  .feedback {
    margin-top:16px; padding:12px 16px; border-radius:10px;
    font-size:0.9rem; display:none;
  }
  .feedback.show { display:block; }
  .feedback.ok { background:var(--accent3)22; border:1px solid var(--accent3)55; color:var(--accent3); }
  .feedback.bad { background:var(--danger)22; border:1px solid var(--danger)55; color:var(--danger); }

  .quiz-next-btn {
    width:100%; margin-top:14px; padding:14px;
    background: var(--accent); color:#000;
    border:none; border-radius:12px; font-family:'Syne',sans-serif;
    font-weight:700; font-size:1rem; cursor:pointer; display:none;
    transition:all .2s;
  }
  .quiz-next-btn.show { display:block; }
  .quiz-next-btn:hover { background:#33eeff; }

  /* ====== RESULT SCREEN ====== */
  .result-wrap { text-align:center; padding: 40px 20px; }
  .result-emoji { font-size:5rem; margin-bottom:16px; }
  .result-title { font-size:2.2rem; font-weight:800; margin-bottom:10px; }
  .result-score { font-size:3.5rem; font-weight:800; color:var(--accent); margin-bottom:20px;
    font-family:'Space Mono',monospace; }
  .result-msg { color:var(--muted); max-width:400px; margin:0 auto 32px; line-height:1.6; }
  .result-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .rbtn {
    padding:14px 28px; border-radius:12px; font-family:'Syne',sans-serif;
    font-weight:700; cursor:pointer; border:none; font-size:1rem; transition:all .2s;
  }
  .rbtn.primary { background:var(--accent); color:#000; }
  .rbtn.primary:hover { background:#33eeff; }
  .rbtn.secondary { background:var(--card); border:1px solid var(--border); color:var(--text); }
  .rbtn.secondary:hover { border-color:var(--accent); }

  /* ====== MODE TABS ====== */
  .mode-tabs {
    display:flex; gap:8px; margin-bottom:24px;
  }
  .mode-tab {
    padding:8px 20px; border-radius:8px; font-family:'Syne',sans-serif;
    font-size:0.85rem; font-weight:700; cursor:pointer; border:1px solid var(--border);
    background:var(--card); color:var(--muted); transition:all .2s;
  }
  .mode-tab.active { background:var(--accent2); border-color:var(--accent2); color:#fff; }

  /* responsive */
  @media(max-width:520px){
    .options-grid { grid-template-columns:1fr; }
    .day-grid { grid-template-columns:repeat(3,1fr); }
  }
</style>
</head>
<body>
<div class="stars"></div>

<header>
  <div class="logo">IT.<span>ENG</span></div>
  <div class="week-badge">MINGGU 1</div>
  <div class="xp-bar-wrap">
    <div class="xp-label">XP <span id="xpNum">0</span></div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
  </div>
</header>

<div class="app">

  <div class="screen active" id="homeScreen">
    <div class="home-title">Belajar <span class="hl">English IT</span><br>Dalam 7 Hari 🚀</div>
    <div class="home-sub">Setiap hari ada 5 perkataan + kuiz. Dengar sebutan, faham makna, jawab soalan!</div>
    <div class="day-grid" id="dayGrid"></div>
    <p style="color:var(--muted);font-size:0.8rem;font-family:'Space Mono',monospace;">
      💡 Klik sebarang hari untuk belajar. Selesaikan untuk buka hari berikutnya.
    </p>

    <button id="btnMinggu2" onclick="window.location.href='minggu2.html'" style="display:none; width:100%; margin-top:20px; padding:16px; background:linear-gradient(135deg, var(--accent2), var(--accent)); color:#fff; border:none; border-radius:12px; font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; cursor:pointer; text-align:center; transition: transform 0.2s;">
      🚀 Seterusnya: Buka Minggu 2!
    </button>
  </div>

  <div class="screen" id="lessonScreen">
    <div class="lesson-header">
      <button class="back-btn" onclick="goHome()">← Balik</button>
      <div class="progress-wrap" id="lessonProgress"></div>
    </div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tabLearn" onclick="setMode('learn')">📖 Belajar</button>
      <button class="mode-tab" id="tabQuiz" onclick="setMode('quiz')">🎯 Kuiz</button>
    </div>

    <div id="learnMode">
      <div class="vocab-card" id="vocabCard"></div>
      <div class="nav-btns">
        <button class="nav-btn prev" onclick="prevWord()">← Sebelum</button>
        <button class="nav-btn next" onclick="nextWord()">Seterusnya →</button>
      </div>
    </div>

    <div id="quizMode" style="display:none;">
      <div class="quiz-card" id="quizCard"></div>
    </div>
  </div>

  <div class="screen" id="resultScreen">
    <div class="result-wrap" id="resultWrap"></div>
  </div>

</div>

<script>
// ========================
// DATA – 7 days × 5 words
// ========================
const curriculum = [
  {

    words: [
      { word:"Hardware", phonetic:"/ˈhɑːdwɛər/", ms:"Perkakasan", category:"Komputer",

  {

    words: [

        speech:"Have you tried restarting it?" },

// ========================
// STATE
// ========================
let state = {
  completedDays: JSON.parse(localStorage.getItem('iteng_done') || '[]'),
  xp: parseInt(localStorage.getItem('iteng_xp') || '0'),
  currentDay: null,
  currentWord: 0,
  mode: 'learn',
  quiz: { questions:[], idx:0, score:0, answered:false }
};

function saveState() {
  localStorage.setItem('iteng_done', JSON.stringify(state.completedDays));
  localStorage.setItem('iteng_xp', state.xp);
}

// ========================
// XP UI
// ========================
function updateXP(add=0) {
  state.xp = Math.min(state.xp + add, 700);
  saveState();
  document.getElementById('xpNum').textContent = state.xp;
  document.getElementById('xpFill').style.width = (state.xp / 700 * 100) + '%';
}
updateXP(0);

// ========================
// HOME
// ========================
function buildHome() {
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = '';
  curriculum.forEach((day, i) => {
    const done = state.completedDays.includes(i);
    const locked = i > 0 && !state.completedDays.includes(i-1);
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (done?' done':'') + (locked?' locked':'');
    btn.innerHTML = `
      <div class="day-num">Hari ${day.day}</div>
      <div class="day-topic">${day.topic}</div>
      <div class="day-label">${day.words.length} perkataan</div>
      ${done ? '<div class="tick">✅</div>' : ''}
      ${locked ? '<div class="tick">🔒</div>' : ''}
    `;
    if (!locked) btn.onclick = () => openDay(i);
    grid.appendChild(btn);
  });

  // Tunjukkan butang "Pergi ke Minggu 2" jika Hari 7 (index ke-6) telah selesai
  const btnM2 = document.getElementById('btnMinggu2');
  if (state.completedDays.includes(6)) {
    btnM2.style.display = 'block';
  } else {
    btnM2.style.display = 'none';
  }
}

// ========================
// NAVIGATION
// ========================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() { showScreen('homeScreen'); buildHome(); }

function openDay(idx) {
  state.currentDay = idx;
  state.currentWord = 0;
  state.mode = 'learn';
  setMode('learn');
  showScreen('lessonScreen');
  renderProgress();
  renderVocab();
}

// ========================
// LESSON
// ========================
function setMode(m) {
  state.mode = m;
  document.getElementById('tabLearn').className = 'mode-tab' + (m==='learn'?' active':'');
  document.getElementById('tabQuiz').className = 'mode-tab' + (m==='quiz'?' active':'');
  document.getElementById('learnMode').style.display = m==='learn' ? '' : 'none';
  document.getElementById('quizMode').style.display = m==='quiz' ? '' : 'none';
  if (m==='quiz') startQuiz();
}

function renderProgress() {
  const words = curriculum[state.currentDay].words;
  const wrap = document.getElementById('lessonProgress');
  wrap.innerHTML = '';
  words.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i < state.currentWord ? ' done' : i === state.currentWord ? ' active' : '');
    wrap.appendChild(d);
  });
}

function renderVocab() {
  const day = curriculum[state.currentDay];
  const w = day.words[state.currentWord];
  document.getElementById('vocabCard').innerHTML = `
    <div class="category-tag">${w.category}</div>
    <div class="word">${w.word}</div>
    <div class="phonetic">${w.phonetic}</div>
    <div class="meaning-ms">🇲🇾 ${w.ms}</div>
    <div class="example">"${w.example}"</div>
    <div class="example-ms">${w.exampleMs}</div>
    <button class="speak-btn" id="speakMainBtn" onclick="speak('${escQ(w.speech)}', 'speakMainBtn')">
      🔊 Dengar Sebutan
    </button>
  `;
  renderProgress();
}

function escQ(s) { return s.replace(/'/g,"&#39;"); }

function prevWord() {
  if (state.currentWord > 0) { state.currentWord--; renderVocab(); }
}
function nextWord() {
  const words = curriculum[state.currentDay].words;
  if (state.currentWord < words.length - 1) {
    state.currentWord++;
    renderVocab();
  } else {
    // prompt quiz
    if (confirm('Tahniah! Anda dah belajar semua perkataan hari ini. 🎉\nNak cuba kuiz sekarang?')) {
      setMode('quiz');
    }
  }
}

// ========================
// SPEECH
// ========================
function speak(text, btnId) {
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-GB';
  utt.rate = 0.85;
  utt.pitch = 1.0;
  // Try to pick a good voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
    || voices.find(v => v.lang.startsWith('en'))
    || voices[0];
  if (preferred) utt.voice = preferred;
  if (btnId) {
    const btn = document.getElementById(btnId);
    if (btn) { btn.classList.add('speaking'); utt.onend = () => btn.classList.remove('speaking'); }
  }
  window.speechSynthesis.speak(utt);
}

// Preload voices
window.speechSynthesis.onvoiceschanged = () => {};

// ========================
// QUIZ
// ========================
function startQuiz() {
  const words = curriculum[state.currentDay].words;
  // Shuffle and generate questions
  const shuffled = [...words].sort(() => Math.random() - 0.5);
  state.quiz = { questions: shuffled, idx: 0, score: 0, answered: false };
  renderQuiz();
}

function renderQuiz() {
  const { questions, idx } = state.quiz;
  if (idx >= questions.length) { showResult(); return; }
  const q = questions[idx];
  const allWords = curriculum[state.currentDay].words;
  // Wrong options
  const wrongs = allWords.filter(w => w.word !== q.word).sort(() => Math.random()-0.5).slice(0,3);
  const opts = [...wrongs, q].sort(() => Math.random()-0.5);
  state.quiz.answered = false;

  document.getElementById('quizCard').innerHTML = `
    <div class="quiz-q">Soalan ${idx+1} / ${questions.length} — Apakah maksud perkataan ini?</div>
    <div class="quiz-word">${q.word}</div>
    <div class="quiz-phonetic">${q.phonetic}</div>
    <button class="quiz-speak-btn" id="qSpeakBtn" onclick="speak('${escQ(q.speech)}', 'qSpeakBtn')">🔊 Dengar Sebutan</button>
    <div class="options-grid" id="optGrid">
      ${opts.map(o => `<button class="option-btn" onclick="answerQuiz('${escQ(o.word)}','${escQ(q.word)}',this)">${o.ms}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="quiz-next-btn" id="qNextBtn" onclick="quizNext()">
      ${idx+1 < questions.length ? 'Soalan Seterusnya →' : 'Lihat Keputusan 🏆'}
    </button>
  `;
}

function answerQuiz(chosen, correct, btn) {
  if (state.quiz.answered) return;
  state.quiz.answered = true;
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (chosen === correct) {
    btn.classList.add('correct');
    state.quiz.score++;
    fb.className = 'feedback show ok';
    fb.textContent = '✅ Betul! Bagus! +10 XP';
    updateXP(10);
  } else {
    btn.classList.add('wrong');
    // highlight correct
    document.querySelectorAll('.option-btn').forEach(b => {
      const msTxt = curriculum[state.currentDay].words.find(w => w.word === correct)?.ms;
      if (b.textContent.trim() === msTxt) b.classList.add('correct');
    });
    fb.className = 'feedback show bad';
    fb.textContent = '❌ Tidak tepat. Cuba ingat semula!';
  }
  document.getElementById('qNextBtn').classList.add('show');
}

function quizNext() {
  state.quiz.idx++;
  renderQuiz();
}

// ========================
// RESULT
// ========================
function showResult() {
  const { score, questions } = state.quiz;
  const pct = Math.round(score / questions.length * 100);
  const dayIdx = state.currentDay;
  if (pct >= 60 && !state.completedDays.includes(dayIdx)) {
    state.completedDays.push(dayIdx);
    updateXP(50);
    saveState();
  }
  let emoji = pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 60 ? '😊' : '💪';
  let msg = pct === 100 ? 'Sempurna! Anda kuasai semua perkataan hari ini!'
    : pct >= 80 ? 'Hebat! Hampir sempurna. Teruskan!'
    : pct >= 60 ? 'Lulus! Ulang kaji lagi untuk lebih baik.'
    : 'Jangan putus asa! Cuba lagi selepas ulang kaji.';

  // Logik butang untuk Hari Terakhir (Ke Minggu 2)
  let nextActionBtn = `<button class="rbtn primary" onclick="goHome()">🏠 Kembali ke Utama</button>`;
  
  if (dayIdx === 6 && pct >= 60) {
    nextActionBtn = `<button class="rbtn primary" onclick="window.location.href='minggu2.html'" style="background:var(--accent2); color:#fff;">🚀 Pergi ke Minggu 2</button>`;
  }

  document.getElementById('resultWrap').innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="result-title">${pct >= 60 ? 'Hari Selesai!' : 'Cuba Lagi!'}</div>
    <div class="result-score">${score}/${questions.length}</div>
    <div class="result-msg">${msg}</div>
    <div class="result-btns">
      <button class="rbtn secondary" onclick="openDay(${dayIdx})">🔁 Cuba Lagi</button>
      ${nextActionBtn}
    </div>
  `;
  showScreen('resultScreen');
}

// ========================
// INIT
// ========================
buildHome();
</script>
</body>
</html>
